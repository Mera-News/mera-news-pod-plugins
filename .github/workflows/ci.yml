# The pod package npm installs (it installs the client) and the data server's GraphQL schema the
# tests serve come from public repositories, read without credentials. Checkout persists no
# credentials either.
name: CI

on:
  push:
  pull_request:

env:
  # The data server commit whose schema the fake data server in the tests serves.
  DATA_SERVER_REV: 6ce01ac6aa94ad95405542bf4a0899bab0395d84

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Fetch the data server schema at the pinned commit
        run: |
          out="$RUNNER_TEMP/data-server"
          git init -q "$out"
          git -C "$out" fetch -q --depth 1 https://github.com/Mera-News/mera-news-data-server "$DATA_SERVER_REV"
          git -C "$out" show FETCH_HEAD:apps/mera-server-news-api/src/schema.gql > "$RUNNER_TEMP/data-server-schema.gql"
          echo "MERA_DATA_SERVER_SCHEMA=$RUNNER_TEMP/data-server-schema.gql" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      # Each plugin's own runtime dependencies. The pod is a development dependency here: it runs
      # the plugins and is checked in its own repository.
      - name: Production dependency licenses
        run: >
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;Zlib;(MIT AND Zlib);CC0-1.0;BlueOak-1.0.0"

  # A tag such as v0.1.0 publishes a release with the desktop extension (.mcpb) built from that commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/bundle/dist/mera-news.mcpb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
